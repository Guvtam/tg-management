name: Collections module tests
on:
  push:
    branches: [feature/cobros-enlaces]
  pull_request:
    branches: [main]
jobs:
  test-cobros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'Django==5.2.16' 'xhtml2pdf==0.2.17'
      - name: Check pending model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run collection tests
        run: python manage.py test finanzas.test_cobros_service finanzas.test_cobros_model
